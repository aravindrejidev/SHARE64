name: Engine tests

# Manual only.
#  - host-tests:     builds the C++ engine on the runner and runs the loopback / fault-injection suite
#                    (plain, then under AddressSanitizer + UBSan)
#  - android-build:  compiles the NDK library, Kotlin modules and the phone app (arm64-v8a only, fast)
#                    and runs the JVM unit tests of :core-network and :core-app
on:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plain build + tests
        run: |
          cmake -S core-cpp/src/main/cpp -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ./build/share64_host_test
      - name: ASan + UBSan build + tests
        run: |
          cmake -S core-cpp/src/main/cpp -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -g -O1"
          cmake --build build-asan -j"$(nproc)"
          ./build-asan/share64_host_test

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build modules and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :core-cpp:assembleDebug :core-network:assembleDebug :core-app:assembleDebug \
            :core-network:testDebugUnitTest :core-app:testDebugUnitTest :app-mobile:assembleDebug \
            -Pshare64.abis=arm64-v8a -Pshare64.universal=false --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: share64-mobile-debug
          path: app-mobile/build/outputs/apk/debug/*.apk
